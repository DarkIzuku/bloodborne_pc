name: Push exact bundled loading image assets

on:
  push:
    branches:
      - loading-assets-probe-20261007-a

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer helper
        uses: actions/checkout@v4
        with:
          ref: loading-assets-probe-20261007-a
          path: helper

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: custom-loading-screens-v1
          path: target

      - name: Assemble and push exact loading images
        shell: bash
        run: |
          set -euo pipefail

          expected_head="dba1b79977470b8776854ac122ca09e3836829b9"
          actual_head="$(git -C target rev-parse HEAD)"
          if [ "$actual_head" != "$expected_head" ]; then
            echo "Refusing to modify target: expected $expected_head, got $actual_head"
            exit 1
          fi

          mkdir -p target/assets/loading_screens
          base64 -d helper/.tmp-loading-transfer/loading_01.b64 > target/assets/loading_screens/loading_01.jpg
          base64 -d helper/.tmp-loading-transfer/loading_02.b64 > target/assets/loading_screens/loading_02.jpg

          curl -A "Mozilla/5.0" -fL --retry 2 -sS "https://images5.alphacoders.com/534/534912.jpg" -o target/assets/loading_screens/loading_03.jpg
          curl -A "Mozilla/5.0" -fL --retry 2 -sS "https://images6.alphacoders.com/585/585462.jpg" -o target/assets/loading_screens/loading_04.jpg
          curl -A "Mozilla/5.0" -fL --retry 2 -sS "https://images7.alphacoders.com/860/860171.jpg" -o target/assets/loading_screens/loading_05.jpg
          curl -A "Mozilla/5.0" -fL --retry 2 -sS "https://images7.alphacoders.com/130/1305260.jpeg" -o target/assets/loading_screens/loading_06.jpg

          (
            cd target
            echo "dc2da2d1b5b8f0c8410084420770990a62fc350d5c6ade8a69e4b90ebfda0732  assets/loading_screens/loading_01.jpg"
            echo "6305642ddfe111954ad57aa4399a8188d2350401a1b7e1a7f534c73ac48686fb  assets/loading_screens/loading_02.jpg"
            echo "47a129aa21ee6d88b95ff3811bb87e71465d2b25672899ca51028373ff16de8d  assets/loading_screens/loading_03.jpg"
            echo "7224c7088960fcd6771922c1a143c08140d811a444f68e2a5454d9f7370aed32  assets/loading_screens/loading_04.jpg"
            echo "5de428fdbc5eb6a646282ca330bfc946ff81c7e9587f7f60f0b7d189a4617a52  assets/loading_screens/loading_05.jpg"
            echo "164e0ae7c807314ab67754f7a84c68f0dde328fe0cc3186b326006216f6afe71  assets/loading_screens/loading_06.jpg"
          ) | (cd target && sha256sum -c -)

          cd target
          test "$(find assets/loading_screens -maxdepth 1 -type f -name 'loading_*.jpg' | wc -l)" -eq 6

          git add assets/loading_screens/loading_01.jpg                   assets/loading_screens/loading_02.jpg                   assets/loading_screens/loading_03.jpg                   assets/loading_screens/loading_04.jpg                   assets/loading_screens/loading_05.jpg                   assets/loading_screens/loading_06.jpg

          actual_files="$(git diff --cached --name-only)"
          expected_files="$(printf '%s\n'             assets/loading_screens/loading_01.jpg             assets/loading_screens/loading_02.jpg             assets/loading_screens/loading_03.jpg             assets/loading_screens/loading_04.jpg             assets/loading_screens/loading_05.jpg             assets/loading_screens/loading_06.jpg)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Unexpected staged file set:"
            printf '%s\n' "$actual_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: bundle six custom loading screens"
          git push origin HEAD:custom-loading-screens-v1
