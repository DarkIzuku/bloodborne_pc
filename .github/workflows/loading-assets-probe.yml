name: Loading assets source probe

on:
  push:
    branches:
      - loading-assets-probe-20261007-a

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact public sources
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/probe
          probe_url() {
            local label="$1" expected="$2" url="$3"
            local out="/tmp/probe/candidate"
            rm -f "$out"
            if curl -A "Mozilla/5.0" -fL --retry 1 --connect-timeout 8 --max-time 35 -sS "$url" -o "$out"; then
              local got size
              got="$(sha256sum "$out" | awk '{print $1}')"
              size="$(stat -c%s "$out")"
              echo "PROBE label=$label size=$size sha256=$got url=$url"
              if [ "$got" = "$expected" ]; then
                echo "EXACT_MATCH label=$label url=$url"
              fi
            fi
          }

          for spec in \
            "loading_03.jpg|47a129aa21ee6d88b95ff3811bb87e71465d2b25672899ca51028373ff16de8d|534|534912|jpg" \
            "loading_04.jpg|7224c7088960fcd6771922c1a143c08140d811a444f68e2a5454d9f7370aed32|585|585462|jpg" \
            "loading_05.jpg|5de428fdbc5eb6a646282ca330bfc946ff81c7e9587f7f60f0b7d189a4617a52|860|860171|jpg" \
            "loading_06.jpg|164e0ae7c807314ab67754f7a84c68f0dde328fe0cc3186b326006216f6afe71|130|1305260|jpeg"
          do
            IFS='|' read -r label expected dir id ext <<<"$spec"
            for host in $(seq 1 10); do
              probe_url "$label" "$expected" "https://images${host}.alphacoders.com/${dir}/${id}.${ext}"
              probe_url "$label" "$expected" "https://images${host}.alphacoders.com/${dir}/thumb-1920-${id}.${ext}"
              if [ "$ext" = "jpeg" ]; then
                probe_url "$label" "$expected" "https://images${host}.alphacoders.com/${dir}/${id}.jpg"
                probe_url "$label" "$expected" "https://images${host}.alphacoders.com/${dir}/thumb-1920-${id}.jpg"
              fi
            done
          done

          probe_url "loading_02.jpg" "6305642ddfe111954ad57aa4399a8188d2350401a1b7e1a7f534c73ac48686fb" \
            "https://images.wallpapersden.com/image/download/bloodborne-gaming-2023_bW5rZmmUmZqaraWkpJRmbmdlrWZlbWU.jpg"
          probe_url "loading_02.jpg" "6305642ddfe111954ad57aa4399a8188d2350401a1b7e1a7f534c73ac48686fb" \
            "https://images.wallpapersden.com/image/download/bloodborne-gaming-2023_bW5rZmmUmZqaraWkpJRmbmdlrWZrZWU.jpg"

          probe_url "loading_01.jpg" "dc2da2d1b5b8f0c8410084420770990a62fc350d5c6ade8a69e4b90ebfda0732" \
            "https://static.zerochan.net/Bloodborne.full.2318714.jpg"
          for host in $(seq 1 10); do
            probe_url "loading_01.jpg" "dc2da2d1b5b8f0c8410084420770990a62fc350d5c6ade8a69e4b90ebfda0732" \
              "https://images${host}.alphacoders.com/916/916448.jpg"
            probe_url "loading_01.jpg" "dc2da2d1b5b8f0c8410084420770990a62fc350d5c6ade8a69e4b90ebfda0732" \
              "https://images${host}.alphacoders.com/916/thumb-1920-916448.jpg"
          done
