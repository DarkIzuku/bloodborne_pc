name: Loading assets candidate bridge

on:
  push:
    branches:
      - loading-assets-probe-20261007-a

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Build close deterministic candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow==12.3.0
          mkdir -p candidates
          curl -A "Mozilla/5.0" -fL -sS             "https://static.zerochan.net/Bloodborne.full.2318714.jpg"             -o /tmp/src01.jpg
          curl -A "Mozilla/5.0" -fL -sS             "https://images.wallpapersden.com/image/download/bloodborne-gaming-2023_bW5rZmmUmZqaraWkpJRmbmdlrWZlbWU.jpg"             -o /tmp/src02-generated.jpg
          curl -A "Mozilla/5.0" -fL -sS             "https://images.wallpapersden.com/image/download/bloodborne-gaming-2023_bW5rZmmUmZqaraWkpJRmbmdlrWZrZWU.jpg"             -o /tmp/src02-original.jpg

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, json

          def H(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          s1=Image.open("/tmp/src01.jpg")
          c1=s1.crop((0,0,1920,1080))
          c1.save("candidates/re01.jpg",format="JPEG",quality=75,subsampling=0,optimize=True,xmp=s1.info.get("xmp"))
          print("re01",Path("candidates/re01.jpg").stat().st_size,H("candidates/re01.jpg"))

          s2=Image.open("/tmp/src02-generated.jpg")
          s2.save("candidates/re02-generated.jpg",format="JPEG",quality=75,subsampling=0,optimize=True)
          print("re02-generated",Path("candidates/re02-generated.jpg").stat().st_size,H("candidates/re02-generated.jpg"))

          so=Image.open("/tmp/src02-original.jpg")
          print("src02-original",so.size,so.info.keys(),len(so.info.get("icc_profile",b"")),len(so.info.get("xmp",b"") or b""))
          # Save the original source and a few natural 1920x1080 crops so local
          # comparison can identify exactly how the user's final was produced.
          Path("candidates/src02-original.jpg").write_bytes(Path("/tmp/src02-original.jpg").read_bytes())
          Path("candidates/src02-generated.jpg").write_bytes(Path("/tmp/src02-generated.jpg").read_bytes())
          for y in (0,260,520):
              if y+1080<=so.height:
                  crop=so.crop((0,y,1920,y+1080))
                  kw=dict(format="JPEG",quality=75,subsampling=0,optimize=True)
                  if so.info.get("icc_profile"): kw["icc_profile"]=so.info["icc_profile"]
                  if so.info.get("xmp"): kw["xmp"]=so.info["xmp"]
                  out=f"candidates/re02-original-y{y}.jpg"
                  crop.save(out,**kw)
                  print(out,Path(out).stat().st_size,H(out))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: loading-image-candidates
          path: candidates/
          if-no-files-found: error
          retention-days: 1
