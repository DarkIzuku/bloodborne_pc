name: Loading assets reproduction probe

on:
  push:
    branches:
      - loading-assets-probe-20261007-a

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce final JPEGs from known public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow==12.3.0
          curl -A "Mozilla/5.0" -fL -sS             "https://images.wallpapersden.com/image/download/bloodborne-gaming-2023_bW5rZmmUmZqaraWkpJRmbmdlrWZlbWU.jpg"             -o /tmp/src02.jpg
          curl -A "Mozilla/5.0" -fL -sS             "https://static.zerochan.net/Bloodborne.full.2318714.jpg"             -o /tmp/src01.jpg
          curl -A "Mozilla/5.0" -fL -sS             "https://images2.alphacoders.com/916/thumb-1920-916448.jpg"             -o /tmp/src01thumb.jpg

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          E1="dc2da2d1b5b8f0c8410084420770990a62fc350d5c6ade8a69e4b90ebfda0732"
          E2="6305642ddfe111954ad57aa4399a8188d2350401a1b7e1a7f534c73ac48686fb"

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def save_variant(im, out, *, xmp=None, icc=None, optimize=True):
              kw=dict(format="JPEG",quality=75,subsampling=0,optimize=optimize)
              if xmp: kw["xmp"]=xmp
              if icc: kw["icc_profile"]=icc
              im.save(out, **kw)
              return sha(out), Path(out).stat().st_size

          s2=Image.open("/tmp/src02.jpg")
          print("SRC02",s2.size,s2.info.keys(),len(s2.info.get("icc_profile",b"")),len(s2.info.get("xmp",b"") or b""))
          for meta in ("both","icc","xmp","none"):
              xmp=s2.info.get("xmp") if meta in ("both","xmp") else None
              icc=s2.info.get("icc_profile") if meta in ("both","icc") else None
              for opt in (True,False):
                  out=f"/tmp/re02-{meta}-{opt}.jpg"
                  got,size=save_variant(s2,out,xmp=xmp,icc=icc,optimize=opt)
                  print("REPRO02",meta,opt,size,got,"MATCH" if got==E2 else "")

          for srcname in ("src01.jpg","src01thumb.jpg"):
              s1=Image.open("/tmp/"+srcname)
              print("SRC01",srcname,s1.size,s1.info.keys(),len(s1.info.get("icc_profile",b"")),len(s1.info.get("xmp",b"") or b""))
              if s1.width != 1920 or s1.height < 1080:
                  continue
              # Most likely operation for a 1920x1249 source is a centered 1920x1080 crop.
              for y in (0, 84, 85, 169):
                  if y+1080>s1.height: continue
                  crop=s1.crop((0,y,1920,y+1080))
                  for meta in ("both","xmp","none"):
                      xmp=s1.info.get("xmp") if meta in ("both","xmp") else None
                      icc=s1.info.get("icc_profile") if meta=="both" else None
                      out=f"/tmp/re01-{srcname}-{y}-{meta}.jpg"
                      got,size=save_variant(crop,out,xmp=xmp,icc=icc,optimize=True)
                      print("REPRO01",srcname,"y",y,meta,size,got,"MATCH" if got==E1 else "")
          PY
