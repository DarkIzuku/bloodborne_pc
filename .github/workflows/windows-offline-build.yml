name: Public Stability Windows Build
# buildcheck-trigger: runtime-recovery-stub

on:
  workflow_dispatch:
  push:
    branches: [public-stability-dlss-v1, public-performance-stability-v2]
    paths:
      - "src/**"
      - "gpu/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "launcher-windows/**"
      - "build.sh"
      - "run.bat"
      - ".github/workflows/windows-offline-build.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'DarkIzuku/bloodborne_pc'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            curl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-miniupnpc

      - name: Build bbport runtime
        shell: msys2 {0}
        run: |
          export CC=clang
          export CXX=clang++
          set +e
          CMAKE_BUILD_PARALLEL_LEVEL=4 bash build.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== extended GPU build failure context ====="
            tail -n 180 out/gpu-build.log || true
            exit "$rc"
          fi

      - name: Build and run precache regression tests
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu pipeline-cache-blob-test pipeline-archive-test motion-history-test motion-shader-test image-overlap-test runtime-gamepad-test settings-test ui-composition-test engine-hooks-test engine-menu-memory-test rebirth-refund-test pc-input-test widescreen-test
          out/gpu/pipeline-cache-blob-test.exe
          out/gpu/pipeline-archive-test.exe
          out/gpu/motion-history-test.exe
          out/gpu/motion-shader-test.exe
          out/gpu/image-overlap-test.exe
          out/gpu/settings-test.exe
          out/gpu/ui-composition-test.exe
          out/gpu/engine-hooks-test.exe
          out/gpu/engine-menu-memory-test.exe
          out/gpu/rebirth-refund-test.exe
          out/gpu/runtime-gamepad-test.exe
          out/gpu/pc-input-test.exe
          ninja -C out/gpu frame-pacing-test
          ctest --test-dir out/gpu -R '^frame-pacing' --no-tests=error --output-on-failure
          out/gpu/widescreen-test.exe
          ninja -C out/gpu button-prompts-test button-prompt-runtime-test
          ctest --test-dir out/gpu -R "^button-prompt" --no-tests=error --output-on-failure

      - name: Verify preparation, patches, and mod safety
        shell: msys2 {0}
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_prepare_cache.py'
          python -m unittest discover -s tests -p 'test_render_pools.py'
          python -m unittest discover -s tests -p 'test_redzone.py'
          python tests/prepare_cache_smoke.py
          python -m unittest discover -s tests -p 'test_prepare.py'
          python -m unittest discover -s tests -p 'test_patches.py'
          python -m unittest discover -s tests -p 'test_mods.py'
          python -m unittest discover -s tests -p 'test_game_check.py'
          python -m unittest discover -s tests -p 'test_windows_frame_rate.py'
          python -m unittest discover -s tests -p 'test_high_frame_rate.py'
          python -m unittest discover -s tests -p 'test_engine_assets.py'
          python -m unittest discover -s tests -p 'test_online.py'
          python -m unittest discover -s tests -p 'test_upscaler_assets.py'
          python -m unittest discover -s tests -p 'test_fsr4cap_dll_info.py'

      - name: Verify native stability and crash diagnostics
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu record-data-test dlss-model-test gc-policy-test user-data-test memory-notifications-test tiled-writeback-test gpu-assert-crash-test trophies-test
          out/gpu/record-data-test.exe --cpu-only
          ctest --test-dir out/gpu -R '^(gc-policy|user-data|memory-notifications|trophies)$' --no-tests=error --output-on-failure
          python tests/gpu_assert_crash_dump.py out/gpu/gpu-assert-crash-test.exe
          python tests/probe_crash_dump.py out/bb-probe.exe

      - name: Verify renderer performance and lifetime regressions
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu liverpool-tasks-test early-z-test gc-policy-test tiled-writeback-test camera-motion-test scene-resolution-test taa-shader-test
          ctest --test-dir out/gpu -R '^(liverpool-tasks|early-z|gc-policy)$' --no-tests=error --output-on-failure
          for shader in out/gpu/early-z-shaders/*.spv; do spirv-val --target-env vulkan1.3 "$shader"; done
          # Hosted runners lack a supported GPU; TileImage readback runs locally.

      - name: Fetch DLSS 310.9.1
        shell: msys2 {0}
        run: bash tools/fetch_dlss.sh out

      - name: Fetch FSR 4 v07 assets
        shell: msys2 {0}
        run: |
          set +e
          bash tools/fetch_fsr4_assets.sh
          fetch_status=$?
          set -e
          count=$(find fsr4_shaders -type f 2>/dev/null | wc -l)
          echo "FSR4 asset files: $count (fetch/optimizer status: $fetch_status)"
          test "$count" -ge 180

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify launcher settings and lifecycle
        shell: pwsh
        run: ./launcher-windows/BloodborneLauncher/Verify-Launcher.ps1 -PreviewDirectory launcher-previews

      - name: Publish launcher
        shell: pwsh
        run: dotnet publish launcher-windows/BloodborneLauncher/BloodborneLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o launcher-publish

      - name: Setup portable Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $ver = '3.13.16'
          $url = "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"
          New-Item -ItemType Directory -Force -Path package/tools/python | Out-Null
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          if ((Get-FileHash python-embed.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '97dae5274cc54867065e8d5a3226e48c35017ed332a0fdb0e27d5b5821961297') { throw 'Python archive checksum mismatch' }
          Expand-Archive python-embed.zip -DestinationPath package/tools/python -Force
          $pth = Get-ChildItem package/tools/python/python*._pth | Select-Object -First 1
          if ($pth) { Add-Content $pth.FullName "..\..\scripts" }

      - name: Assemble portable test package
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p package/out package/scripts package/patches package/mods package/launcher-assets
          cp -f launcher-publish/BloodborneLauncher.exe package/
          cp -f run.bat build.sh setup.bat package/
          cp -f out/bb-probe.exe out/bb-gpu-capabilities.exe out/bb-engine-assets.exe package/out/
          cp -f launcher-windows/BloodborneLauncher/Assets/bloodborne.ico package/out/
          test ! -f out/nvngx_dlss.dll || cp -f out/nvngx_dlss.dll package/out/
          cp -rf scripts/* package/scripts/
          test ! -d patches || cp -rf patches/* package/patches/
          test ! -d fsr4_shaders || cp -rf fsr4_shaders package/
          test ! -f LICENSE || cp -f LICENSE package/
          test ! -d licenses || cp -rf licenses package/
          cp -f out/LICENSE-DLSS-SDK.txt package/licenses/LICENSE-DLSS-SDK.txt
          mkdir -p package/licenses/msys2
          cp -rf /clang64/share/licenses/. package/licenses/msys2/
          test ! -f README.md || cp -f README.md package/
          copy_deps() { local exe="$1"; ldd "$exe" 2>/dev/null | awk '{print $3}' | grep -E '^/[A-Za-z]/msys64/clang64/bin/.*\.dll$|^/clang64/bin/.*\.dll$' || true; }
          for exe in out/bb-probe.exe out/bb-gpu-capabilities.exe out/bb-engine-assets.exe; do
            while IFS= read -r dll; do [ -f "$dll" ] && cp -f "$dll" package/out/; done < <(copy_deps "$exe")
          done
          python tools/audit_public_package.py package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-PC-Stability-${{ github.sha }}
          path: package/
          compression-level: 6
          if-no-files-found: error
